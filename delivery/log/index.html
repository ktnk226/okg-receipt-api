  };

  return (
    <div class="app-shell">
      {/* SIDEBAR (PC PANEL) */}
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">🛵</div>
          <div>
            <div class="brand-title">DELIVERY LOG</div>
            <p style={{fontSize:'10px', color:'var(--muted)'}}>デリログ // V13 PRO</p>
          </div>
        </div>
        <nav class="nav-menu">
          <button class={`nav-item ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>📊 ホーム</button>
          <button class={`nav-item ${activeTab === 'memos' ? 'active' : ''}`} onClick={() => setActiveTab('memos')}>📝 メモ / Inbox</button>
          <button class={`nav-item ${activeTab === 'expenses' ? 'active' : ''}`} onClick={() => setActiveTab('expenses')}>🧾 経費</button>
          <button class={`nav-item ${activeTab === 'calendar' ? 'active' : ''}`} onClick={() => setActiveTab('calendar')}>📅 カレンダー</button>
          <button class={`nav-item ${activeTab === 'settings' ? 'active' : ''}`} onClick={() => setActiveTab('settings')}>⚙️ 設定・同期</button>
          <button className="nav-item" onClick={() => setActiveTab('goals')}>🎯 目標管理</button>
          <button className="nav-item" onClick={() => setActiveTab('simulator')}>🧮 逆算</button>
        </nav>
      </aside>

      {/* MAIN LAYOUT CONTENT */}
      <div class="main-content">
        <header class="topbar">
          <div>
            <p>Target // {date.replace(/-/g,'/')}</p>
            <h1>🛵 DELIVERY LOG</h1>
          </div>
          <div style={{display:'flex', gap:'10px'}}>
            {isDirty ? (
              <div class="cloud-indicator unsaved" onClick={saveToiCloudJSON} style={{cursor:'pointer'}}>⚠️ 未保存 (保存)</div>
            ) : (
              <div class="cloud-indicator">💾 JSON保存済み</div>
            )}
          </div>
        </header>

        {/* 📅 PERIOD SWITCHER TABS & NAVIGATION */}
        {['dashboard','goals'].includes(activeTab) && (
          <div class="period-switcher-container">
            <div class="period-tabs">
              <button class={`period-tab ${period === 'day' ? 'active' : ''}`} onClick={() => setPeriod('day')}>日</button>
              <button class={`period-tab ${period === 'week' ? 'active' : ''}`} onClick={() => setPeriod('week')}>週</button>
              <button class={`period-tab ${period === 'month' ? 'active' : ''}`} onClick={() => setPeriod('month')}>月</button>
              <button class={`period-tab ${period === 'year' ? 'active' : ''}`} onClick={() => setPeriod('year')}>年</button>
            </div>
            
            <div class="period-nav-bar">
              <button class="period-nav-btn" onClick={() => handleStepPeriod(-1)}>◀</button>
              <div class="period-nav-display">{currentNavText}</div>
              <button class="period-nav-btn" onClick={() => handleStepPeriod(1)}>▶</button>
            </div>
          </div>
        )}

        {/* 📊 iPhone-first LIVE SUMMARY HEADER */}
        {activeTab === 'dashboard' && (
          <>
            <div class="summary-bar">
              <div class="sum-row"><div class="sum-item"><div class="sum-label">総売上</div><div class="sum-val accent">{activePeriodData.total.toLocaleString()}円</div></div></div>
              <div class="sum-row">
                <div class="sum-item"><div class="sum-label">配達件数</div><div class="sum-val green">{activePeriodData.cnt}件</div></div>
                <div class="sum-item"><div class="sum-label">実働時間</div><div class="sum-val">{activePeriodData.hours > 0 ? formatHours(activePeriodData.hours) : '-'}</div></div>
              </div>
              <div class="sum-row">
                <div class="sum-item"><div class="sum-label">UPH</div><div class="sum-val teal">{activePeriodData.uph}</div></div>
                <div class="sum-item"><div class="sum-label">時給換算</div><div class="sum-val yellow">{activePeriodData.hours > 0 ? activePeriodData.periodJikyu.toLocaleString()+'円' : '-'}</div></div>
              </div>
              <div class="sum-row">
                <div class="sum-item"><div class="sum-label">実質売上</div><div class="sum-val">{activePeriodData.real.toLocaleString()}円</div></div>
                <div class="sum-item"><div class="sum-label">クエ抜き単価</div><div class="sum-val">{activePeriodData.cnt > 0 ? activePeriodData.realTanka.toLocaleString()+'円' : '-'}</div></div>
              </div>
            </div>
            <details class="summary-secondary">
              <summary>その他の集計</summary>
              <div class="summary-extra">
                <div class="sum-row"><span>走行距離</span><span class="sum-val">{activePeriodData.km > 0 ? activePeriodData.km+'km' : '-'}</span></div>
                <div class="sum-row"><span>キロ単価</span><span class="sum-val">{activePeriodData.kmTanka > 0 ? activePeriodData.kmTanka.toLocaleString()+'円/km' : '-'}</span></div>
                <div class="sum-row"><span>1件単価</span><span class="sum-val">{activePeriodData.cnt > 0 ? activePeriodData.tanka.toLocaleString()+'円' : '-'}</span></div>
                <div class="sum-row"><span>クエスト合計</span><span class="sum-val">{activePeriodData.que.toLocaleString()}円</span></div>
              </div>
            </details>
            {period === 'day' && <button class="quick-log-btn" onClick={() => document.getElementById('delivery-set-entry')?.scrollIntoView({behavior:'smooth',block:'start'})}>＋ 稼働セットを入力</button>}
          </>
        )}

        {/* 🌓 週モード限定：【平日】＆【週末】分割集計 */}
        {activeTab === 'dashboard' && period === 'week' && (
          <div class="week-split-container">
            <div class="split-card">
              <div class="split-title weekday">📅 平日 (月〜木)</div>
              <div class="split-main-amt">{periodicAnalysis.week.monThu.total.toLocaleString()} <span style={{fontSize:'13px', fontWeight:'normal', color:'var(--muted2)'}}>円</span></div>
              <div class="split-sub-row">
                <span>実質: <strong>{periodicAnalysis.week.monThu.real.toLocaleString()}</strong>円</span>
                {periodicAnalysis.week.monThu.que > 0 && <span style={{color:'var(--teal)'}}>クエ: {periodicAnalysis.week.monThu.que.toLocaleString()}円</span>}
              </div>
              <div class="split-sub-metrics">
                <span>📦 <strong>{periodicAnalysis.week.monThu.cnt}</strong>件</span>
                <span>⏱️ {formatHours(periodicAnalysis.week.monThu.hours)}</span>
                <span>⚡ UPH {periodicAnalysis.week.monThu.uph}</span>
                <span>💴 時給 {periodicAnalysis.week.monThu.jikyu > 0 ? periodicAnalysis.week.monThu.jikyu.toLocaleString()+'円' : '-'}</span>
              </div>
            </div>

            <div class="split-card">
              <div class="split-title weekend">🔥 週末 (金〜日)</div>
              <div class="split-main-amt">{periodicAnalysis.week.friSun.total.toLocaleString()} <span style={{fontSize:'13px', fontWeight:'normal', color:'var(--muted2)'}}>円</span></div>
              <div class="split-sub-row">
                <span>実質: <strong>{periodicAnalysis.week.friSun.real.toLocaleString()}</strong>円</span>
                {periodicAnalysis.week.friSun.que > 0 && <span style={{color:'var(--teal)'}}>クエ: {periodicAnalysis.week.friSun.que.toLocaleString()}円</span>}
              </div>
              <div class="split-sub-metrics">
                <span>📦 <strong>{periodicAnalysis.week.friSun.cnt}</strong>件</span>
                <span>⏱️ {formatHours(periodicAnalysis.week.friSun.hours)}</span>
                <span>⚡ UPH {periodicAnalysis.week.friSun.uph}</span>
                <span>💴 時給 {periodicAnalysis.week.friSun.jikyu > 0 ? periodicAnalysis.week.friSun.jikyu.toLocaleString()+'円' : '-'}</span>
              </div>
            </div>
          </div>
        )}

        {/* 🎯 GOAL PANEL (目標パネルを上に配置) */}
        {activeTab === 'goals' && (
          <div class="goal-panel">
            <div class="goal-inputs-container">
              <div class="goal-input-row">
                <div class="goal-title-flex"><span>🎯 {periodLabels[period]}目標金額</span></div>
                <div class="goal-input-wrapper">
                  <input class="goal-input" type="number" value={activePeriodData.goalAmt || ''} onChange={e => updatePeriodicGoal('amt', e.target.value)} placeholder="未設定" />
                  <span style={{fontSize:'14px', color:'var(--muted)'}}>円</span>
                </div>
              </div>
              <div class="goal-input-row">
                <div class="goal-title-flex"><span>📦 {periodLabels[period]}目標件数</span></div>
                <div class="goal-input-wrapper">
                  <input class="goal-input" type="number" value={activePeriodData.goalCnt || ''} onChange={e => updatePeriodicGoal('cnt', e.target.value)} placeholder="未設定" />
                  <span style={{fontSize:'14px', color:'var(--muted)'}}>件</span>
                </div>
              </div>
            </div>
            
            {activePeriodData.goalAmt > 0 && (
              <div class="progress-section">
                <div class="progress-track"><div class="progress-bar" style={{ width: `${activePeriodData.percentAmt}%` }}></div></div>
                <div class="goal-footer-row">
                  <div class="goal-footer-top">
                    <div class="goal-status-text">金額達成率 <strong>{activePeriodData.percentAmt}%</strong></div>
                    {activePeriodData.remainAmt <= 0 ? (
                      <div class="goal-remain-text done">🎉 金額目標達成！</div>
                    ) : (
                      <div class="goal-remain-text remain">残り {activePeriodData.remainAmt.toLocaleString()}円</div>
                    )}
                  </div>
                  
                  {/* ⚡ パターンB: プラットフォーム別 目安必要件数の即時換算 */}
                  {activePeriodData.remainAmt > 0 && (
                    <div class="goal-footer-sub">
                      <span style={{ color: 'var(--muted)' }}>目安残数:</span>
                      <span style={{ color: '#ff5555', fontWeight: '800' }}>
                        D: 約{activePeriodData.needCntD}件
                        <span style={{ fontSize: '10px', color: 'var(--muted)', marginLeft: '3px' }}>
                          ({activePeriodData.effectiveDTanka}円{activePeriodData.isRealD ? '' : '基'})
                        </span>
                      </span>
                      <span style={{ color: '#00e676', fontWeight: '800' }}>
                        U: 約{activePeriodData.needCntU}件
                        <span style={{ fontSize: '10px', color: 'var(--muted)', marginLeft: '3px' }}>
                          ({activePeriodData.effectiveUTanka}円{activePeriodData.isRealU ? '' : '基'})
                        </span>
                      </span>
                    </div>
                  )}
                </div>
              </div>
            )}

            {activePeriodData.goalCnt > 0 && (
              <div class="progress-section" style={{marginTop:'8px'}}>
                <div class="progress-track"><div class="progress-bar green" style={{ width: `${activePeriodData.percentCnt}%` }}></div></div>
                <div class="goal-footer-row">
                  <div class="goal-footer-top">
                    <div class="goal-status-text">件数達成率 <strong>{activePeriodData.percentCnt}%</strong></div>
                    {activePeriodData.remainCnt <= 0 ? (
                      <div class="goal-remain-text done">🎉 件数目標達成！</div>
                    ) : (
                      <div class="goal-remain-text remain">残り {activePeriodData.remainCnt} 件</div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
        )}

        {/* ── TAB 1: DASHBOARD (HOME) ── */}
        <Planner view={activeTab} vault={vault} goals={periodicGoals} date={date} p={planning} onChange={savePlanning} navigate={setActiveTab} error={planState.error} />
        <div class={`view-container ${activeTab === 'dashboard' ? 'active' : ''}`}>
          
          {/* Platform breakdown: stacked cards for narrow screens */}
          <div class="section-title" style={{marginTop: 0}}>プラットフォーム別内訳</div>
          <div class="platform-overview">
            {PLATFORMS.map(p => {
              const targetPf = activePeriodData.pf?.[p.key] || { s: 0, c: 0 };
              const pfTanka = targetPf.c > 0 ? Math.round(targetPf.s / targetPf.c) : 0;
              return <div key={p.key} class="platform-overview-card" style={{borderLeftColor:p.color}}>
                <div class="platform-overview-name" style={{color:p.color}}>{p.label}</div>
                <div class="platform-overview-amount">{targetPf.s.toLocaleString()}<small> 円</small></div>
                <div class="platform-overview-stats"><span>{targetPf.c} 件</span><span>平均 {pfTanka > 0 ? pfTanka.toLocaleString()+'円/件' : '-'}</span></div>
              </div>;
            })}
          </div>

          {period === 'day' && (
            <>
              <div class="section-title">📝 本日の概要 & コンディション</div>
              <div class="card grid-3">
                <div><label>営業日</label><input type="date" value={date} onChange={e => setDate(e.target.value)} style={{borderColor:'var(--teal)'}} /></div>
                <div><label>天気</label><select value={weather} onChange={e => updateDayField('weather', e.target.value)}>{WEATHERS.map(w => <option key={w}>{w}</option>)}</select></div>
                <div><label>睡眠時間 (h)</label><input type="number" step="0.5" value={sleepHours} onChange={e => updateDayField('sleepHours', e.target.value)} /></div>
              </div>

              {/* ⚡ 体調直感タップ */}
              <div class="card" style={{padding:'14px 18px', marginTop:'-6px'}}>
                <label>本日の体調レベル (直感タップ)</label>
                <div class="condition-row">
                  {COND_ICONS.map(c => (
                    <button key={c.val} class={`cond-btn ${condition === c.val ? 'active' : ''}`} onClick={() => updateDayField('condition', c.val)}>
                      {c.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* 📝 日次メモ */}
              <div class="section-title">📝 本日の気づき・日記メモ</div>
              <div class="card" style={{padding:'14px'}}>
                <textarea
                  class="daily-memo-textarea"
                  placeholder="現場での気づき、加盟店の状況、感情、トラブル、明日の課題など何でも殴り書き。"
                  value={dailyMemo}
                  onChange={e => updateDayField('dailyMemo', e.target.value)}
                />
              </div>
            </>
          )}

          {/* セット詳細 */}
          {period === 'day' && (
            <>
              <div class="section-title" id="delivery-set-entry" style={{scrollMarginTop:"90px"}}>⏱️ 稼働セットごとの詳細入力</div>
              {calced.map((s, i) => {
                const durText = s.dur ? `${s.dur.h > 0 ? s.dur.h + '時間' : ''}${s.dur.m}分` : '時間未入力';
                return (
                  <div key={i} class="set-card">
                    <div class="set-header" onClick={() => toggleOpen(i)}>
                      <div class="set-header-top">
                        <div class="set-title">
                          <span>SET {i+1}</span>
                          {s.start && !s.end && <span class="set-badge active">稼働中</span>}
                          {s.start && s.end && <span class="set-badge done">完了</span>}
                        </div>
                        <span class="chevron">{s.open ? '▲' : '▼'}</span>
                      </div>
                      <div class="set-summary-row1">{s.sc} 件 / {s.sp.toLocaleString()} 円</div>
                      <div class="set-summary-row2">
                        <span class="set-summary-tag">⏱️ {durText}</span>
                        <span class="set-summary-tag">💴 時給 {s.setJikyu > 0 ? s.setJikyu.toLocaleString() + '円' : '-'}</span>
                      </div>
                    </div>

                    {s.open && (
                      <div style={{padding:'16px'}}>
                        <div class="time-row">
                          <div>
                            <label>開始時刻</label>
                            <div class="time-field">
                              <input type="time" value={sets[i].start} onChange={e => updateSet(i,'start',e.target.value)} />
                              <button class="stamp-btn" onClick={() => updateSet(i,'start',getNow())}>NOW</button>
                            </div>
                          </div>
                          <div>
                            <label>終了時刻</label>
                            <div class="time-field">
                              <input type="time" value={sets[i].end} onChange={e => updateSet(i,'end',e.target.value)} />
                              <button class="stamp-btn secondary" onClick={() => updateSet(i,'end',getNow())}>FIN</button>
                            </div>
                          </div>
                        </div>

                        {PLATFORMS.map(p => (
                          <div key={p.key} class="platform-block" style={{background: p.color+'06', borderColor: p.color+'25'}}>
                            <div class="platform-title" style={{color: p.color}}>
                              <span>{p.label}</span>
                              <span class="diff-badge">+{s[p.key+'_p'].toLocaleString()}円 / {s[p.key+'_c']}件</span>
                            </div>
                            <div class="pf-inputs">
                              <div><label>売上(累)</label><input type="number" placeholder="0" value={sets[i][p.key+'_cum'] || ''} onChange={e => updateSet(i, p.key+'_cum', e.target.value)} /></div>
                              <div><label>件数(累)</label><input type="number" placeholder="0" value={sets[i][p.key+'_cnt_cum'] || ''} onChange={e => updateSet(i, p.key+'_cnt_cum', e.target.value)} /></div>
                              <div><label>クエ(累)</label><input type="number" placeholder="0" value={sets[i][p.key+'_que_cum'] || ''} onChange={e => updateSet(i, p.key+'_que_cum', e.target.value)} /></div>
                            </div>
                          </div>
                        ))}

                        <div class="grid-2" style={{margin: '12px 0'}}>
                          <div><label>走行距離累積 (km)</label><input type="number" placeholder="0" value={sets[i].km_cum} onChange={e => updateSet(i,'km_cum',e.target.value)} /></div>
                          <div><label>区間距離</label><div style={{paddingTop:'14px', color:'var(--teal)', fontWeight:'800', fontFamily:'var(--font-mono)'}}>{s.km_p > 0 ? `+${s.km_p} km` : '-'}</div></div>
                        </div>

                        <div style={{marginTop:'10px'}}><label>戦術メモ</label><textarea rows="2" placeholder="メモ記入" value={sets[i].memo} onChange={e => updateSet(i,'memo',e.target.value)} /></div>
                        {sets.length > 1 && <button class="del-btn" onClick={() => deleteSet(i)}>SET {i+1} を削除</button>}
                      </div>
                    )}
                  </div>
                );
              })}
              <button class="add-btn" onClick={addPeriodicSet}>＋ 次のセットを追加</button>

              <div style={{marginTop:'24px', marginBottom:'24px'}}>
                <button class="gen-btn" onClick={() => setShowLog(!showLog)}>{showLog ? '報告ログを閉じる' : '🚀 V5報告ログを生成'}</button>
                {showLog && (
                  <div class="log-box">
                    <pre>{generateLog()}</pre>
                    <button class="copy-btn" onClick={() => { navigator.clipboard.writeText(generateLog()); alert('コピー完了！'); }}>ログをコピーする</button>
                  </div>
                )}
              </div>
            </>
          )}
        </div>

        {/* ── TAB 2: MEMOS / INBOX (Google Keep風ポップアップ編集) ── */}
        <div class={`view-container ${activeTab === 'memos' ? 'active' : ''}`}>
          <div class="section-title">💡 クイック新規メモ (Inbox)</div>
          <div class="card">
            <div style={{display:'flex', gap:'8px', marginBottom:'12px'}}>
              {MEMO_CATEGORIES.map(c => (
                <button key={c} class={`memo-cat-btn ${newMemoCat === c ? 'active' : ''}`} onClick={() => setNewMemoCat(c)}>{c}</button>
              ))}
            </div>
            <textarea
              class="daily-memo-textarea"
              placeholder="思いついたアイデア、買出し、備忘録などをパッと入力..."
              value={newMemoText}
              onChange={e => setNewMemoText(e.target.value)}
              style={{minHeight:'110px'}}
            />
            <button class="gen-btn" style={{marginTop:'12px', padding:'16px', fontSize:'17px'}} onClick={addInboxMemo}>メモを保存する</button>
          </div>

          <div class="section-title">🔍 メモ検索 & 一覧 (タップして全面編集)</div>
          <div style={{display:'flex', gap:'10px', marginBottom:'12px'}}>
            <input type="text" placeholder="キーワードで即座に検索..." value={memoSearch} onChange={e => setMemoSearch(e.target.value)} />
          </div>

          <div class="memo-cat-filter">
            {['すべて', ...MEMO_CATEGORIES].map(cat => (
              <button key={cat} class={`memo-cat-btn ${memoFilter === cat ? 'active' : ''}`} onClick={() => setMemoFilter(cat)}>{cat}</button>
            ))}
          </div>

          {filteredMemos.length === 0 ? (
            <div style={{textAlign:'center', padding:'40px 20px', color:'var(--muted)', fontSize:'16px'}}>該当するメモがありません</div>
          ) : (
            filteredMemos.map(m => (
              <div key={m.id} class="memo-item-card" onClick={() => setEditingMemoId(m.id)}>
                <div class="memo-item-header">
                  <span class="memo-tag-pill">{m.cat}</span>
                  <span>{m.date} {m.time}</span>
                </div>
                
                <div class="memo-preview-text">
                  {m.text || <span style={{color:'var(--muted)'}}>（内容がありません）</span>}
                </div>

                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:'4px'}}>
                  <span style={{fontSize:'12px', color:'var(--muted2)'}}>👆 タップで全面編集</span>
                  <div style={{display:'flex', gap:'8px'}} onClick={e => e.stopPropagation()}>
                    <button class="stamp-btn secondary" style={{minHeight:'36px', fontSize:'12px', padding:'0 12px'}} onClick={() => { navigator.clipboard.writeText(m.text); alert('コピーしました！'); }}>コピー</button>
                    <button class="stamp-btn" style={{minHeight:'36px', fontSize:'12px', background:'rgba(255,50,50,0.2)', color:'#ff5555'}} onClick={() => deleteInboxMemo(m.id)}>削除</button>
                  </div>
                </div>
              </div>
            ))
          )}
        </div>

        {/* 🪟 全面ポップアップ編集モーダル (Google Keep風) */}
        {activeEditingMemo && (
          <div class="modal-overlay" onClick={() => setEditingMemoId(null)}>
            <div class="memo-modal-card" onClick={e => e.stopPropagation()}>
              <div class="modal-header">
                <div style={{display:'flex', gap:'6px', overflowX:'auto'}}>
                  {MEMO_CATEGORIES.map(c => (
                    <button
                      key={c}
                      class={`memo-cat-btn ${activeEditingMemo.cat === c ? 'active' : ''}`}
                      style={{padding:'6px 12px', fontSize:'13px'}}
                      onClick={() => setInboxMemoCat(activeEditingMemo.id, c)}
                    >
                      {c}
                    </button>
                  ))}
                </div>
                <button
                  class="stamp-btn secondary"
                  style={{minHeight:'38px', padding:'0 14px', fontSize:'14px', borderRadius:'8px'}}
                  onClick={() => setEditingMemoId(null)}
                >
                  完了
                </button>
              </div>

              <div class="modal-body">
                <textarea
                  class="modal-textarea"
                  placeholder="メモを入力..."
                  value={activeEditingMemo.text}
                  onChange={e => updateInboxMemoText(activeEditingMemo.id, e.target.value)}
                  autoFocus
                />
              </div>

              <div class="modal-footer">
                <span style={{fontSize:'13px', color:'var(--muted)'}}>{activeEditingMemo.date} {activeEditingMemo.time}</span>
                <div style={{display:'flex', gap:'8px'}}>
                  <button
                    class="stamp-btn secondary"
                    style={{minHeight:'38px', fontSize:'13px', padding:'0 14px'}}
                    onClick={() => { navigator.clipboard.writeText(activeEditingMemo.text); alert('コピーしました！'); }}
                  >
                    コピー
                  </button>
                  <button
                    class="stamp-btn"
                    style={{minHeight:'38px', fontSize:'13px', background:'rgba(255,50,50,0.2)', color:'#ff5555', padding:'0 14px'}}
                    onClick={() => deleteInboxMemo(activeEditingMemo.id)}
                  >
                    削除
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ── TAB 3: CALENDAR ── */}
        <div class={`view-container ${activeTab === 'calendar' ? 'active' : ''}`}>
          <div class="cal-header-container">
            <div class="cal-title-nav">
              <button class="cal-nav-btn" onClick={() => handleCalendarMonthChange(-1)}>◀</button>
              <span class="cal-title-text">{calYear}年 {calMonth}月</span>
              <button class="cal-nav-btn" onClick={() => handleCalendarMonthChange(1)}>▶</button>
            </div>
            <div class="cal-monthly-total">{currentCalendarMonthTotal.toLocaleString()} 円</div>
          </div>

          <div class="card" style={{padding:'6px', marginBottom: '24px'}}>
            <div class="cal-grid">
              {['月','火','水','木','金','土','日'].map(w => <div key={w} class="cal-head-cell">{w}</div>)}
              {calendarDays.map((c, idx) => c.empty ? <div key={idx} class="cal-day-cell empty" /> : (
                <div key={idx} class={`cal-day-cell ${date === c.dateKey ? 'selected' : ''}`} onClick={() => { setDate(c.dateKey); setPeriod('day'); setActiveTab('dashboard'); }}>
                  <div class="cal-day-top">
                    <span class="cal-day-num current-month">{c.dayNum}</span>
                    {c.cond && <span class="cal-day-cond">{COND_ICONS.find(icon => icon.val === c.cond)?.label.split(' ')[0]}</span>}
                  </div>
                  <div class="cal-day-amt-box">
                    <span class="cal-day-amt">{formatSmartAmt(c.amt)}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        <div class={`view-container ${activeTab === 'expenses' ? 'active' : ''}`}>
          <ExpenseView expenses={expenses} onSave={saveExpenses} loadError={expenseState.error} />
        </div>

        {/* ── TAB 4: SETTINGS ── */}
        <div class={`view-container ${activeTab === 'settings' ? 'active' : ''}`}>
          <div class="section-title">☁️ iCloud Drive バックアップ / 同期</div>
          <div class="card" style={{borderColor:'var(--blue)', background:'rgba(41,121,255,0.03)'}}>
            <p style={{fontSize:'14px', color:'var(--muted2)', marginBottom:'14px'}}>
              稼働ログ、メモ、目標設定、経費を含む全データをJSONファイルで保存・復元します。写真は含みません。
            </p>
            <div class="grid-2">
              <button class="gen-btn" style={{background:'var(--blue)'}} onClick={saveToiCloudJSON}>💾 iCloudへ完全保存</button>
              <button class="gen-btn" style={{background:'rgba(255,255,255,0.1)', color:'#fff', border:'1.5px solid var(--border)'}} onClick={() => document.getElementById('settingsCloudLoad').click()}>📥 iCloudから同期</button>
            </div>
            <input type="file" id="settingsCloudLoad" accept=".json" style={{display:'none'}} onChange={loadFromiCloudJSON} />
          </div>
          <div class="section-title">データコントロール</div>
          <div class="card">
            <button class="gen-btn" style={{background:'rgba(255,92,26,0.2)', color:'var(--accent)', border:'1.5px solid var(--accent)'}} onClick={startNewDay}>新しい営業日を開始する (4時起点)</button>
          </div>
        </div>

        {/* BOTTOM NAV TABS */}
        <nav class="bottom-nav">
          <button class={`tab-btn ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>ホーム</span>
          </button>
          <button class={`tab-btn ${activeTab === 'memos' ? 'active' : ''}`} onClick={() => setActiveTab('memos')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg><span>メモ</span>
          </button>
          <button class={`tab-btn ${activeTab === 'expenses' ? 'active' : ''}`} onClick={() => setActiveTab('expenses')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-4 2-4-2-3 2zM8 7h8M8 11h8M8 15h4"/></svg><span>経費</span>
          </button>
          <button class={`tab-btn ${activeTab === 'calendar' ? 'active' : ''}`} onClick={() => setActiveTab('calendar')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="18" y2="10"/></svg><span>カレンダー</span>
          </button>
          <button class={`tab-btn ${activeTab === 'settings' ? 'active' : ''}`} onClick={() => setActiveTab('settings')}>
            <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83-2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>設定</span>
          </button>
        </nav>
      </div>
    </div>
  );
}

const EMPTY_SET = () => ({
  start: '', end: '', d_cum: '', u_cum: '', r_cum: '', m_cum: '', d_cnt_cum: '', u_cnt_cum: '', r_cnt_cum: '', m_cnt_cum: '', d_que_cum: '', u_que_cum: '', r_que_cum: '', m_que_cum: '', km_cum: '', memo: '', open: true,
});

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
